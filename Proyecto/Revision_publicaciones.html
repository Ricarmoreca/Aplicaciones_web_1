<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Revisión de publicaciones</title>
<link href="Revision_publicaciones.css" rel="stylesheet"/>
</head>
<body>
  <div class="header">
    <h1>Revisión de publicaciones</h1>
    <div class="top-links">
      <a href="Dashboard.html">Volver al panel</a>
      <a href="Publicaciones.html">Ver publicaciones</a>
    </div>
  </div>

  <div id="msg" class="no-data"></div>
  <div id="list"></div>

  <script>
(function(){
    let publicaciones = JSON.parse(localStorage.getItem('publications') || '[]');
    const contenedor = document.getElementById('list');

    function render(){
        contenedor.innerHTML = '';
        const pendientes = publicaciones.filter(pub => pub.status === 'en_revision');
        if(pendientes.length === 0){
            contenedor.innerHTML = '<p>No hay publicaciones pendientes.</p>';
            return;
        }

        pendientes.forEach(pub => {
            const indexReal = publicaciones.findIndex(p => p.id === pub.id);
            const div = document.createElement('div');
            div.className = 'publicacion';
            div.innerHTML = `
                <h3>${pub.title}</h3>
                <p><strong>Autor(es):</strong> ${pub.authors}</p>
                <p><strong>Tipo:</strong> ${pub.type}</p>
                <p><strong>Fecha:</strong> ${pub.date}</p>
                <p><strong>Estado:</strong> ${pub.status}</p>
                <button onclick="verPDF(${indexReal})">Ver PDF / DOI</button>
                <button onclick="aprobar(${indexReal})">Aprobar</button>
                <button onclick="rechazar(${indexReal})">Rechazar</button>
                <hr>
            `;
            contenedor.appendChild(div);
        });
    }

    window.verPDF = function(index){
        const pub = publicaciones[index];
        if(pub.pdfData){
            const win = window.open();
            win.document.write(`<iframe src="${pub.pdfData}" width="100%" height="100%"></iframe>`);
        } else if(pub.doi){
            window.open(pub.doi, '_blank');
        } else {
            alert('No hay PDF ni DOI.');
        }
    }

    window.aprobar = function(index){
        const pub = publicaciones[index];
        if(!confirm(`¿Aprobar "${pub.title}"?`)) return;
        const sesion = JSON.parse(localStorage.getItem('session') || 'null');
        pub.status = 'aprobada';
        pub.approvedBy = sesion ? sesion.email : '';
        pub.approvedAt = new Date().toISOString();
        publicaciones[index] = pub;
        localStorage.setItem('publications', JSON.stringify(publicaciones));
        render();
        alert('Publicación aprobada.');
    }

    window.rechazar = function(index){
        const pub = publicaciones[index];
        const motivo = prompt('Motivo del rechazo (opcional):');
        const sesion = JSON.parse(localStorage.getItem('session') || 'null');
        pub.status = 'rechazada';
        pub.rejectedBy = sesion ? sesion.email : '';
        pub.rejectedReason = motivo || '';
        pub.rejectedAt = new Date().toISOString();
        publicaciones[index] = pub;
        localStorage.setItem('publications', JSON.stringify(publicaciones));
        render();
        alert('Publicación rechazada.');
    }

    render();
})();
</script>
</body>
</html>
