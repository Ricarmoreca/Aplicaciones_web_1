<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Registrar publicación</title>
<link href="Registro_publicacion.css" rel="stylesheet"/>
</head>
<body>
    <form id="formPublicacion" action="#" method="post">
        <div class="Titulo_publicacion">
            <label for="Titulo">Título de la publicación:</label><br>
            <input type="text" id="Titulo" name="titulo" required><br>
        </div>

        <div class="Autores">
            <label for="Autor">Autor/autores:</label><br>
            <input type="text" id="Autor" name="autores" required><br>
        </div>

        <div class="Tipo_publicacion">
            <label for="Tipo">Tipo de publicación:</label><br>
            <select id="Tipo" name="tipo_publicacion" required>
                <option value="" disabled selected>Seleccione tipo</option>
                <option value="libro">Libro</option>
                <option value="artículo">Artículo</option>
                <option value="tesis">Tesis</option>
                <option value="ponencia">Ponencia</option>
            </select><br>
        </div>

        <div class="Fecha_publicacion">
            <label for="Fecha">Fecha de publicación:</label><br>
            <input type="date" id="Fecha" name="fecha" required><br>
        </div>

        <div class="DOI_enlace">
            <label for="doi">DOI o enlace (URL):</label><br>
            <input
                type="text"
                id="doi"
                name="doi"
                placeholder="https://doi.org/10.1234/ejemplo o 10.1234/ejemplo"
                pattern="^(https?://\S+)|(10\.\d{4,9}/\S+)$"
                title="Ingrese una URL válida o un DOI (ej: 10.1234/ejemplo)."
            ><br>
        </div>

        <div class="PDF_archivo">
            <label for="pdf">Archivo PDF (opcional, máximo 5 MB):</label><br>
            <input type="file" id="pdf" name="pdf" accept="application/pdf"><br>
        </div>

        <div class="acciones_registro">
            <input type="submit" name="registrar" value="Registrar publicación">
        </div>
    </form>

    <div id="notification" class="notification"></div>

<script>
(function () {
    var form = document.getElementById('formPublicacion');
    var notification = document.getElementById('notification');
    var MAX_PDF_SIZE = 5 * 1024 * 1024;

    function showNotification(message, type = 'success') {
        notification.textContent = message;
        notification.className = 'notification ' + (type === 'error' ? 'error' : '');
        notification.classList.add('show');
        setTimeout(() => notification.classList.remove('show'), 3000);
    }

    function fileToDataURL(file) {
        return new Promise((resolve, reject) => {
            var reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(new Error('Error leyendo el archivo'));
            reader.readAsDataURL(file);
        });
    }

    form.addEventListener('submit', async function(e){
        e.preventDefault();

        var Titulo = document.getElementById('Titulo').value.trim();
        var Autor = document.getElementById('Autor').value.trim();
        var Tipo = document.getElementById('Tipo').value.trim();
        var Fecha = document.getElementById('Fecha').value;
        let DoiVal = document.getElementById('doi').value.trim();
        var PdfInput = document.getElementById('pdf');

        if(!Titulo || !Autor || !Tipo || !Fecha) 
            return showNotification('Complete todos los campos.', 'error');

        if(DoiVal){
            if(/^10\.\d{4,9}\/\S+$/i.test(DoiVal)){
                DoiVal = 'https://doi.org/' + DoiVal;
            } else if(!/^https?:\/\//i.test(DoiVal)){
                return showNotification('Ingrese una URL válida o DOI.', 'error');
            }
        } else DoiVal = null;

        let PdfData = null;
        if(PdfInput.files.length > 0){
            var file = PdfInput.files[0];
            if(file.size > MAX_PDF_SIZE) 
                return showNotification('Archivo demasiado grande.', 'error');
            try { 
                PdfData = await fileToDataURL(file); 
            } catch { 
                return showNotification('Error leyendo el PDF.', 'error'); 
            }
        }

        var session = JSON.parse(localStorage.getItem('session') || 'null');
        if(!session || session.rol.toLowerCase() !== 'docente'){
            return showNotification('Solo docentes pueden crear publicaciones.', 'error');
        }

        var publications = JSON.parse(localStorage.getItem('publications') || '[]');
        var newPub = {
            id: Date.now(),
            title: Titulo,
            authors: Autor,
            type: Tipo,
            date: Fecha,
            doi: DoiVal,
            pdfData: PdfData,
            status: 'en_revision',
            createdBy: session.email,
            createdByName: session.name,
            createdAt: new Date().toISOString(),
            approvedBy: null,
            approvedAt: null
        };

        publications.push(newPub);
        localStorage.setItem('publications', JSON.stringify(publications));

        showNotification('✅ Publicación registrada y enviada a revisión.');

        // Redirigir luego de registrar
        setTimeout(() => {
            if (session.rol.toLowerCase() === 'administrador') {
                window.location.href = 'Revision_publicaciones.html';
            } else {
                window.location.href = 'Publicaciones.html';
            }
}, 1500);
    });
})();
</script>
</body>
</html>
