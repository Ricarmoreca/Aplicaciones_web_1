<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Registrar usuario</title>
<link href ="Registro_usuario.css" rel="stylesheet"/>
</head>
<body>
    <h1>REGISTRO DE USUARIO</h1>
    <form id="formulario" action="#" method="post">
        <div class="campos_registro">
        <label for="nombres">Nombre completo:</label><br>
        <input type="text" id="nombres" name="correo" required><br>
        
        <label for="correo">Correo Institucional:</label><br>
        <input type="email" id="correo" name="correo" required><br>

        <label for="rol">Rol del usuario:</label><br>
        <select id="rol" name="rol" required>
            <option value="" disabled selected>Seleccione rol</option>
            <option value="estudiante">Estudiante</option>
            <option value="docente">Docente</option>
            <option value="administrador">Administrador</option>
        </select><br>


        <label for="contrasena">Contraseña:</label><br>
        <input type="password" id="contraseña" name="contraseña" required><br>

        <label for="confirmar">Confirmar contraseña:</label><br>
        <input type="password" id="confirmar" name="confirmar" required><br>
        </div>
        
        <div class="acciones_registro">
        <input type="submit" name="enviar" value="Registrarse"><br><br>
        </div>

        <div class="links_registro">
        <a href="Inicio_sesion.html">¿Ya tiene una cuenta? Inicie sesión</a><br><br>
        </div>
    </form>

    <script>
    async function hashSHA256(text) {
        const enc = new TextEncoder();
        const data = enc.encode(text);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    (function () {
        var form = document.getElementById('formulario');
        var nameEl = document.getElementById('nombres');
        var emailEl = document.getElementById('correo');
        var rolEl = document.getElementById('rol');
        var passEl = document.getElementById('contraseña');
        var confirmEl = document.getElementById('confirmar');

        // Crear credencial admin por defecto si no existe
        (async function ensureAdmin(){
            var users = JSON.parse(localStorage.getItem('users') || '[]');
            var adminEmail = 'admin@live.uleam.edu.ec';
            if (!users.find(u => (u.email||'').toLowerCase() === adminEmail)) {
                var adminPass = 'Admin1234!';
                var passHash = await hashSHA256(adminPass);
                users.push({
                    email: adminEmail,
                    name: 'Administrador',
                    rol: 'administrador',
                    passwordHash: passHash
                });
                localStorage.setItem('users', JSON.stringify(users));
                console.info('Usuario administrador creado:', adminEmail, '/', adminPass);
            }
        })();

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            var nameVal = (nameEl.value || '').trim();
            var correoVal = (emailEl.value || '').trim().toLowerCase();
            var rolVal = (rolEl.value || '').trim().toLowerCase();
            var passVal = (passEl.value || '').trim();
            var confirmVal = (confirmEl.value || '').trim();

            if (!nameVal || !correoVal || !rolVal || !passVal || !confirmVal) {
                alert('Por favor, complete todos los campos.');
                return;
            }

            var uleamRe = /^[^\s@]+@(?:live\.)?uleam\.edu\.ec$/i;
            if (!uleamRe.test(correoVal)) {
                alert('Por favor, ingrese su correo institucional de la ULEAM (ej: usuario@uleam.edu.ec o usuario@live.uleam.edu.ec).');
                emailEl.focus();
                return;
            }

            if (passVal !== confirmVal) {
                alert('Las contraseñas no coinciden. Por favor verifique.');
                confirmEl.focus();
                return;
            }

            // comprobar usuario duplicado
            var users = JSON.parse(localStorage.getItem('users') || '[]');
            if (users.find(u => (u.email || '').toLowerCase() === correoVal)) {
                alert('El correo ya está registrado.');
                emailEl.focus();
                return;
            }

            // guardar usuario (con hash de contraseña)
            var passHash = await hashSHA256(passVal);
            var newUser = {
                email: correoVal,
                name: nameVal,
                rol: rolVal,
                passwordHash: passHash
            };
            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));

            // crear sesión
            localStorage.setItem('session', JSON.stringify({ email: correoVal, name: nameVal, rol: rolVal }));

            // redirigir según rol
            if (rolVal === 'administrador' || rolVal === 'administrador' || rolVal === 'administrador') {
                window.location.replace('Dashboard.html');
            } else {
                window.location.replace('Publicaciones.html');
            }
        });
    })();
    </script>
</body>
</html>
