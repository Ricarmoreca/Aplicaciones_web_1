<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Consulta de publicaciones</title>
<link href="Consulta.css" rel="stylesheet"/>
</head>
<body>
  <h1>Buscar publicaciones</h1>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Buscar por título, autor o palabra clave" style="flex:1;min-width:220px">
    <select id="typeFilter">
      <option value="">Filtrar por tipo (todos)</option>
    </select>
    <select id="yearFilter">
      <option value="">Filtrar por año (todos)</option>
    </select>
    <button id="clearBtn">Limpiar</button>
  </div>

  <div id="counts" class="small"></div>

  <div id="results">
    <!-- Tabla para escritorio -->
    <table id="resultsTable">
      <thead>
        <tr>
          <th>Título</th>
          <th>Autores</th>
          <th>Tipo</th>
          <th>Año</th>
          <th>Estado</th>
          <th>Enlaces</th>
        </tr>
      </thead>
      <tbody id="resultsBody"></tbody>
    </table>

    <!-- Tarjetas para mobile -->
    <div id="resultsCards" style="display:none"></div>

    <div id="noData" class="no-data" style="display:none">No se encontraron publicaciones.</div>
  </div>

  <script>
  (function () {
    function escapeHTML(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    var searchInput = document.getElementById('searchInput');
    var typeFilter = document.getElementById('typeFilter');
    var yearFilter = document.getElementById('yearFilter');
    var clearBtn = document.getElementById('clearBtn');
    var resultsBody = document.getElementById('resultsBody');
    var resultsCards = document.getElementById('resultsCards');
    var resultsTable = document.getElementById('resultsTable');
    var noData = document.getElementById('noData');
    var counts = document.getElementById('counts');

    function loadPubs(){
      return JSON.parse(localStorage.getItem('publications') || '[]');
    }

    function getUnique(arr, keyFn){
      var s = new Set();
      arr.forEach(function(x){ s.add(keyFn(x)); });
      return Array.from(s).filter(function(v){ return v && v !== ''; }).sort();
    }

    function populateFilters(){
      var pubs = loadPubs();
      var types = getUnique(pubs, function(p){ return p.type || ''; });
      var years = getUnique(pubs, function(p){ return (p.date && p.date.slice(0,4)) || ''; });

      // limpiar y llenar tipo
      typeFilter.innerHTML = '<option value="">Filtrar por tipo (todos)</option>';
      types.forEach(function(t){ var opt = document.createElement('option'); opt.value = t; opt.textContent = t; typeFilter.appendChild(opt); });

      // años
      yearFilter.innerHTML = '<option value="">Filtrar por año (todos)</option>';
      years.forEach(function(y){ var opt = document.createElement('option'); opt.value = y; opt.textContent = y; yearFilter.appendChild(opt); });
    }

    function matches(pub, term){
      if (!term) return true;
      term = term.toLowerCase();
      var hay = String(pub.title || '') + ' ' + String(pub.authors || '') + ' ' + String(pub.type || '');
      return hay.toLowerCase().indexOf(term) !== -1;
    }

    function render(){
      var pubs = loadPubs();
      var term = (searchInput.value || '').trim().toLowerCase();
      var tfilter = (typeFilter.value || '').trim();
      var yfilter = (yearFilter.value || '').trim();

      var filtered = pubs.filter(function(p){
        if (!matches(p, term)) return false;
        if (tfilter && (String(p.type || '') !== tfilter)) return false;
        if (yfilter && String((p.date||'').slice(0,4)) !== yfilter) return false;
        return true;
      });

      counts.textContent = 'Resultados: ' + filtered.length + ' — Totales en sistema: ' + pubs.length;

      // render tabla (desktop)
      resultsBody.innerHTML = filtered.map(function(pub){
        var year = (pub.date && pub.date.slice(0,4)) || '';
        var doiLink = pub.doi ? '<a href="'+escapeHTML(pub.doi)+'" target="_blank">DOI/Enlace</a>' : '';
        var pdfLink = pub.pdfData ? '<a href="'+escapeHTML(pub.pdfData)+'" download="'+escapeHTML((pub.title||'publicacion').replace(/[^a-z0-9\-]/gi,'_'))+'.pdf">PDF</a>' : '';
        return '<tr data-id="'+escapeHTML(pub.id)+'">'+
          '<td>'+escapeHTML(pub.title)+'</td>'+
          '<td>'+escapeHTML(pub.authors)+'</td>'+
          '<td>'+escapeHTML(pub.type||'')+'</td>'+
          '<td>'+escapeHTML(year)+'</td>'+
          '<td>'+escapeHTML(pub.status||'')+'</td>'+
          '<td class="links">'+doiLink+' '+pdfLink+'</td>'+
        '</tr>';
      }).join('');

      // render tarjetas (mobile)
      resultsCards.innerHTML = filtered.map(function(pub){
        var year = (pub.date && pub.date.slice(0,4)) || '';
        var doiLink = pub.doi ? '<a href="'+escapeHTML(pub.doi)+'" target="_blank">DOI/Enlace</a>' : '';
        var pdfLink = pub.pdfData ? '<a href="'+escapeHTML(pub.pdfData)+'" download="'+escapeHTML((pub.title||'publicacion').replace(/[^a-z0-9\-]/gi,'_'))+'.pdf">PDF</a>' : '';
        return '<div class="card" data-id="'+escapeHTML(pub.id)+'">'+
          '<h3>'+escapeHTML(pub.title)+'</h3>'+
          '<p><strong>Autores:</strong> '+escapeHTML(pub.authors)+'</p>'+
          '<p><strong>Tipo:</strong> '+escapeHTML(pub.type||'')+' — <strong>Año:</strong> '+escapeHTML(year)+'</p>'+
          '<p><strong>Estado:</strong> '+escapeHTML(pub.status||'')+'</p>'+
          '<p class="links">'+doiLink+' '+pdfLink+'</p>'+
        '</div>';
      }).join('');

      // mostrar/ocultar según pantalla
      if (window.innerWidth <= 700){
        resultsTable.style.display = 'none';
        resultsCards.style.display = 'block';
      } else {
        resultsTable.style.display = '';
        resultsCards.style.display = 'none';
      }

      noData.style.display = (filtered.length === 0) ? '' : 'none';
    }

    // eventos
    searchInput.addEventListener('input', render);
    typeFilter.addEventListener('change', render);
    yearFilter.addEventListener('change', render);
    clearBtn.addEventListener('click', function(){ searchInput.value=''; typeFilter.value=''; yearFilter.value=''; render(); });

    // reload filters + render
    populateFilters();
    render();

    // actualizar dinámicamente si cambian publicaciones
    window.addEventListener('storage', function(e){
      if (e.key === 'publications' || e.key === null) { // null puede indicar clear
        populateFilters();
        render();
      }
    });

    // ajustar vista al redimensionar
    window.addEventListener('resize', render);
  })();
  </script>
</body>
</html>
